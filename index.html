<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jesse Niesen</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Jesse Niesen. FDE. Six tabs.">
<style>
:root{--bg:#0a0a0a;--fg:#eaeaea;--line:#2a2a2a;--accent:#c9ff3f;--muted:#777}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font-family:ui-monospace,"JetBrains Mono",Menlo,monospace}
.wrap{max-width:960px;margin:0 auto;padding:28px 16px}
.ident{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1{font-size:1.6rem;font-weight:700;margin-bottom:20px}
.graph{border:1px solid var(--line);padding:12px;margin-bottom:16px}
.graph img{width:100%;height:auto;filter:grayscale(1) contrast(1.15)}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;border:1px solid var(--line);background:var(--line)}
@media(max-width:800px){.tabs{grid-template-columns:repeat(2,1fr)}}
.tab{background:var(--bg);padding:18px 12px;text-decoration:none;color:var(--fg);display:block;min-height:110px}
.tab:hover{background:#111;color:var(--accent)}
.tab .k{font-size:.65rem;color:var(--muted);letter-spacing:.1em}
.tab .v{font-size:1rem;margin-top:8px;font-weight:700}
.tab .s{font-size:.65rem;color:var(--muted);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="ident">FDE · USMC</div>
  <h1>Jesse Niesen</h1>
  <div class="graph">
    <img alt="GitHub graph" src="https://github-readme-stats.vercel.app/api?username=reggieanddro&show_icons=true&hide_border=true&title_color=c9ff3f&icon_color=c9ff3f&text_color=eaeaea&bg_color=0a0a0a">
  </div>
  <div class="tabs" id="tabs"></div>
</div>
<script>
fetch("worlds.json").then(function(r){return r.json()}).then(function(w){
  document.getElementById("tabs").innerHTML=w.map(function(x){
    return '<a class="tab" href="'+x.url+'"><div class="k">'+x.k+'</div><div class="v">'+x.v+'</div><div class="s">'+(x.status||"")+'</div></a>';
  }).join("");
});
</script>
</body>
</html>
